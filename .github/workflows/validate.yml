name: Validar projeto Power BI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Testar ferramentas
        run: python -m unittest discover -s tests -v
      - name: Validar metadados e documentacao
        run: python scripts/validate_project.py
